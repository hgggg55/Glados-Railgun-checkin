name: GLaDOS Checkin

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
      - 'imgs/**'
  schedule:
    # 每天 UTC 时间 1:00 和 4:00 运行（北京时间 9:00 和 12:00）
    - cron: '0 1,4 * * *'

jobs:
  build:
    name: GLADOS/Railgun Checkin
    runs-on: ubuntu-latest
      
    permissions:
      contents: read
      actions: write

    strategy:
      matrix:
        python-version: ['3.12']

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pypushdeer

    - name: Run checkin script
      run: |
        python checkin.py
      env:
        PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
        GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
        GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
        GLADOS_VERBOSE: ${{ secrets.GLADOS_VERBOSE }}

    - name: Keepalive Workflow
      uses: gautamkrishnar/keepalive-workflow@v2
        
    - name: Delete old workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 7
        keep_minimum_runs: 7
        delete_run_by_conclusion_pattern: successimport json
import os
import requests

# 1. 从环境变量获取配置
cookie = os.getenv("GLADOS_COOKIES")
# 优先从环境变量读取兑换方案，如果没有配置则默认使用 plan100（100积分兑换10天）
exchange_plan = os.getenv("GLADOS_EXCHANGE_PLAN", "plan100")

headers = {
    "cookie": cookie,
    "referer": "https://glados.cloud/console/checkin",
    "origin": "https://glados.cloud",
    "user-agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
    "content-type": "application/json;charset=UTF-8",
}


def check_and_exchange():
    # 2. 查询当前账号积分
    status_url = "https://glados.cloud/api/user/status"
    try:
        res = requests.get(status_url, headers=headers).json()
        if res.get("code") == 0:
            points = int(float(res.get("data", {}).get("points", 0)))
            print(f"当前积分: {points}")

            # 3. 判断积分满 100 执行自动兑换
            if points >= 100:
                print("积分已满 100，触发自动兑换...")
                exchange_url = "https://glados.cloud/api/user/exchange"
                payload = {"plan": exchange_plan}

                ex_res = requests.post(
                    exchange_url, headers=headers, data=json.dumps(payload)
                ).json()
                print(f"兑换结果: {ex_res.get('message')}")
            else:
                print("积分不足 100，暂不兑换。")
        else:
            print(f"获取状态失败: {res.get('message')}")
    except Exception as e:
        print(f"请求发生异常: {e}")


if __name__ == "__main__":
    check_and_exchange()
