name: auto check

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'imgs/**'
  schedule:
    - cron: '0 1,4 * * *'

jobs:
  build:
    name: glados/railgun checkin
    runs-on: ubuntu-latest
      
    permissions:
      contents: read
      actions: write

    strategy:
      matrix:
        python-version: [3.13]

    # 这里加入全局环境变量，强制后续所有第三方 actions 兼容 Node.js 24 运行环境
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    # 安装 python 库
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        pip install pypushdeer

    # 执行 签到脚本
    - name: Running checkin
      run: |
        python checkin.py
      env:
        PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
        GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
        GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
        GLADOS_VERBOSE: ${{ secrets.GLADOS_VERBOSE }}

    - name: Keep alive
      uses: liskin/gh-workflow-keepalive@v1 
        
    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 7
        keep_minimum_runs: 7
        delete_run_by_conclusion_pattern: success
COOKIE="YOUR_COOKIE_HERE"

# 1. 自动签到
echo ">>> 正在执行签到..."
curl -s -X POST "https://glados.cloud/api/user/checkin" \
  -H "cookie: $COOKIE" \
  -H "referer: https://glados.cloud/console/checkin" \
  -H "origin: https://glados.cloud" \
  -H "content-type: application/json;charset=UTF-8" \
  -H "user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
  -d '{"token":"glados.one"}'

echo -e "\n"

# 2. 获取积分并判断是否兑换
echo ">>> 正在获取账号积分状态..."
STATUS_RES=$(curl -s -X GET "https://glados.cloud/api/user/status" \
  -H "cookie: $COOKIE" \
  -H "user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)")

# 提取积分 (默认匹配 points 数字)
POINTS=$(echo "$STATUS_RES" | grep -o '"points":"[^"]*"' | cut -d'"' -f4 | cut -d'.' -f1)

# 如果提取不到字符串格式的 points，尝试匹配数字格式
if [ -z "$POINTS" ]; then
    POINTS=$(echo "$STATUS_RES" | grep -o '"points":[0-9]*' | cut -d':' -f2)
fi

echo "当前积分: ${POINTS:-未知}"

# 3. 积分达到或超过 100 时触发兑换
if [ -n "$POINTS" ] && [ "$POINTS" -ge 100 ]; then
    echo ">>> 积分已达到 100，正在兑换 10 天套餐..."
    curl -s -X POST "https://glados.cloud/api/user/exchange" \
      -H "cookie: $COOKIE" \
      -H "referer: https://glados.cloud/console/checkin" \
      -H "origin: https://glados.cloud" \
      -H "content-type: application/json;charset=UTF-8" \
      -H "user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
      -d '{"plan":"plan100"}'
    echo -e "\n兑换请求已发送！"
else
    echo ">>> 积分不足 100，暂不执行兑换。"
fi
