COOKIE="YOUR_COOKIE_HERE"

# 1. 自动签到
echo ">>> 正在执行签到..."
curl -s -X POST "https://glados.cloud/api/user/checkin" \
  -H "cookie: $COOKIE" \
  -H "referer: https://glados.cloud/console/checkin" \
  -H "origin: https://glados.cloud" \
  -H "content-type: application/json;charset=UTF-8" \
  -H "user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
  -d '{"token":"glados.one"}'

echo -e "\n"
echo ">>> 正在获取账号积分状态..."
STATUS_RES=$(curl -s -X GET "https://glados.cloud/api/user/status" \
  -H "cookie: $COOKIE" \
  -H "user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)")

# 提取积分 (默认匹配 points 数字)
POINTS=$(echo "$STATUS_RES" | grep -o '"points":"[^"]*"' | cut -d'"' -f4 | cut -d'.' -f1)

# 如果提取不到字符串格式的 points，尝试匹配数字格式
if [ -z "$POINTS" ]; then
    POINTS=$(echo "$STATUS_RES" | grep -o '"points":[0-9]*' | cut -d':' -f2)
fi

echo "当前积分: ${POINTS:-未知}"

# 3. 积分达到或超过 100 时触发兑换
if [ -n "$POINTS" ] && [ "$POINTS" -ge 100 ]; then
    echo ">>> 积分已达到 100，正在兑换 10 天套餐..."
    curl -s -X POST "https://glados.cloud/api/user/exchange" \
      -H "cookie: $COOKIE" \
      -H "referer: https://glados.cloud/console/checkin" \
      -H "origin: https://glados.cloud" \
      -H "content-type: application/json;charset=UTF-8" \
      -H "user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
      -d '{"plan":"plan100"}'
    echo -e "\n兑换请求已发送！"
else
    echo ">>> 积分不足 100，暂不执行兑换。"
fi
