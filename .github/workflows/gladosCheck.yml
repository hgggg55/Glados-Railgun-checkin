name: GLaDOS Checkin

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
      - 'imgs/**'
  schedule:
    # 每天 UTC 时间 1:00 和 4:00 运行（北京时间 9:00 和 12:00）
    - cron: '0 1,4 * * *'

jobs:
  build:
    name: GLADOS/Railgun Checkin
    runs-on: ubuntu-latest
      
    permissions:
      contents: read
      actions: write

    strategy:
      matrix:
        python-version: ['3.12']

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pypushdeer

    - name: Run checkin script
      run: |
        python checkin.py
      env:
        PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
        GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
        GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
        GLADOS_VERBOSE: ${{ secrets.GLADOS_VERBOSE }}

    - name: Keepalive Workflow
      uses: gautamkrishnar/keepalive-workflow@v2
        
    - name: Delete old workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 7
        keep_minimum_runs: 7
        delete_run_by_conclusion_pattern: success
